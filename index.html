  const sp=document.createElement('span'); sp.textContent=msg; el.appendChild(sp);
  let done=false; const dismiss=()=>{ if(done) return; done=true; el.classList.add('out'); setTimeout(()=>el.remove(),320); };
  if(action){ const b=document.createElement('button'); b.type='button'; b.textContent=action.label; b.addEventListener('click',()=>{ action.fn(); dismiss(); }); el.appendChild(b); }
  host.appendChild(el); while(host.children.length>3) host.firstElementChild.remove();
  setTimeout(dismiss,action?6500:3600);
}

/* ================= actions ================= */
function setPage(b,v){ b.current=clamp(parseInt(v)||0,0,b.pages||99999); b.touched=Date.now(); if(b.status==='want') applyStatus(b,'reading'); }
function finishedThisYear(){ return state.books.filter(x=>x.status==='finished'&&(x.finished||'').startsWith(YEAR+'-')).length; }
const ACTIONS={
  'add-book':el=>openForm(null,el),
  'close':el=>closeModal(el.dataset.modal),
  'notes-all':()=>{ ui.notesAll=!ui.notesAll; renderNotes(); },
  'hero-pick':el=>{ hero.pick=el.dataset.id; renderHero(); },
  'start-reading':el=>{ const b=byId(el.dataset.id); if(!b) return; applyStatus(b,'reading'); commit(); },
  'finish':el=>{ const b=byId(el.dataset.id); if(!b) return; applyStatus(b,'finished'); commit(); toast('Finished! That’s '+finishedThisYear()+' this year.',{label:'Write the report',fn:()=>openBook(b.id,{tab:'report'})}); },
  'read-report':el=>openReport(el.dataset.id,el),
  'edit-report':el=>{ const id=el.dataset.id; closeModal('reportModal'); if(ui.openId===id){ ui.tab='report'; renderRight(true); } else openBook(id,{tab:'report'}); },
  'set-status':el=>{
    const b=byId(ui.openId); if(!b||b.status===el.dataset.status) return;
    applyStatus(b,el.dataset.status); commit({spread:'left'});
    if(b.status==='finished') toast('Finished! That’s '+finishedThisYear()+' this year.',{label:'Write the report',fn:()=>{ if(ui.openId===b.id){ ui.tab='report'; renderRight(true); } }});
  },
  'rate':el=>{ const b=byId(ui.openId); if(!b) return; const n=+el.dataset.n; b.rating=b.rating===n?0:n; commit({spread:'left'}); },
  'edit-book':el=>openForm(ui.openId,el),
  'remove-ask':()=>{ ui.rmAsk=true; renderLeft(); },
  'remove-no':()=>{ ui.rmAsk=false; renderLeft(); const r=$('#spRemove'); if(r) r.focus(); },
  'remove-yes':()=>{
    const b=byId(ui.openId); if(!b) return; const i=state.books.indexOf(b);
    state.books.splice(i,1); ui.rmAsk=false; closeBook(); commit({spread:false});
    toast('Removed “'+b.title+'”.',{label:'Undo',fn:()=>{ state.books.splice(Math.min(i,state.books.length),0,b); commit(); }});
  },
  'tab':el=>{ if(ui.tab===el.dataset.tab) return; flushReport(); ui.tab=el.dataset.tab; renderRight(true); const t=$(ui.tab==='notes'?'#tabNotes':'#tabReport'); if(t) t.focus({preventScroll:true}); },
  'del-note':el=>{
    const b=byId(ui.openId); if(!b) return; const i=b.notes.findIndex(n=>n.id===el.dataset.id); if(i<0) return;
    const n=b.notes.splice(i,1)[0]; commit({spread:'right'});
    toast(n.type==='text'?'Note removed.':n.type==='photo'?'Picture removed.':'Drawing removed.',{label:'Undo',fn:()=>{ const bb=byId(b.id); if(!bb) return; bb.notes.splice(i,0,n); commit({spread:'right'}); }});
  },
  /* dates */
  'pick-date':el=>{ const b=byId(ui.openId); if(!b) return; const f=el.dataset.f; openDatePop(el,b[f],v=>{ b[f]=v; b.touched=Date.now(); commit({spread:'left'}); },true,dateLimits(b,f)); },
  'pick-fdate':el=>{ if(!ui.draft) return; const f=el.dataset.f; openDatePop(el,ui.draft[f],v=>{ if(!ui.draft) return; ui.draft[f]=v; $('#fErr').textContent=''; syncForm(); },true,dateLimits(ui.draft,f)); },
  'pick-ndate':el=>{ const b=byId(ui.openId), n=b&&b.notes.find(x=>x.id===el.dataset.id); if(!n) return; openDatePop(el,localISO(n.at)||today(),v=>{ if(!v) return; n.at=new Date(v+'T12:00:00').toISOString(); commit({spread:'right'}); },false); },
  'dp-move':el=>{ let m=DP.m+(+el.dataset.d), y=DP.y; if(m<0){ m=11; y--; } if(m>11){ m=0; y++; } DP.m=m; DP.y=y; renderDatePop(); placeDatePop(); const nb=$('#datePop [data-action="dp-move"][data-d="'+el.dataset.d+'"]:not(:disabled)')||$('#datePop .dp-day:not(:disabled)')||$('#dpMonth'); if(nb) nb.focus(); },
  'dp-pick':el=>{ const cb=DP.cb, v=el.dataset.v; closeDatePop(true); if(cb) cb(v); },
  /* note paper */
  'toggle-sheets':()=>{ ui.sheetOpen=!ui.sheetOpen; renderRight(); const p=$('#paperBtn'); if(p) p.focus({preventScroll:true}); },
  'sheet-p':el=>{
    const v=el.dataset.v;
    if(el.dataset.scope==='draw'){ Dr.sheet=v+':'+sheetParts(Dr.sheet).t; savePref('yera-library/dsheet',Dr.sheet); Dr.dirty=true; syncDrawTools(); renderDrawSheets(); const f=$('#spp-draw-'+v); if(f) f.focus(); }
    else { ui.sheet=v+':'+sheetParts(ui.sheet).t; savePref('yera-library/sheet',ui.sheet); renderRight(); }
  },
  'sheet-t':el=>{
    const v=el.dataset.v;
    if(el.dataset.scope==='draw'){ Dr.sheet=normSheet(sheetParts(Dr.sheet).p+':'+v,'blank:ivory',true); savePref('yera-library/dsheet',Dr.sheet); Dr.dirty=true; syncDrawTools(); renderDrawSheets(); const f=$('#spt-draw-'+v); if(f) f.focus(); }
    else { let p=sheetParts(ui.sheet).p; if(p==='plain') p='lined'; ui.sheet=p+':'+v; savePref('yera-library/sheet',ui.sheet); renderRight(); }
  },
  /* drawings and pictures */
  'new-sketch':el=>startSketch(el),
  'edit-media':el=>editMedia(el.dataset.id,el),
  'd-tool':el=>{ Dr.tool=el.dataset.tool; savePenPref(); syncDrawTools(); },
  'd-color':el=>{ Dr.color=el.dataset.c; if(Dr.tool==='eraser') Dr.tool='pen'; savePenPref(); syncDrawTools(); },
  'd-size':el=>{ Dr.size=+el.dataset.s; savePenPref(); syncDrawTools(); },
  'd-undo':()=>{ if(!Dr.undo.length) return; Dr.redo.push(Dr.strokes); Dr.strokes=Dr.undo.pop(); Dr.dirty=true; redraw(); syncDrawTools(); },
  'd-redo':()=>{ if(!Dr.redo.length) return; Dr.undo.push(Dr.strokes); Dr.strokes=Dr.redo.pop(); Dr.dirty=true; redraw(); syncDrawTools(); },
  'd-clear':()=>{ if(!Dr.strokes.length) return; Dr.undo.push(Dr.strokes); Dr.strokes=[]; Dr.redo=[]; Dr.dirty=true; redraw(); syncDrawTools(); },
  'd-sheets':()=>{ const p=$('#dSheets'); p.hidden=!p.hidden; $('#dPaperBtn').setAttribute('aria-expanded',String(!p.hidden)); renderDrawSheets(); layoutDraw(); },
  'd-cancel':()=>cancelDraw(),
  'd-keep':()=>{ Dr.asking=false; renderDrawEnd(); },
  'd-discard':()=>{ Dr.asking=false; Dr.dirty=false; popModal('drawModal'); freeDraw(); },
  'd-done':()=>saveDraw(),
  /* the book form */
  'form-status':el=>{ readForm(); const d=ui.draft; d.status=el.dataset.status; if(d.status==='reading'&&!d.started) d.started=today(); if(d.status==='finished'&&!d.finished) d.finished=today(); syncForm(); },
  'pick-color':el=>{ readForm(); ui.draft.color=el.dataset.id; syncForm(); },
  'pick-design':el=>{
    readForm(); const v=el.dataset.d;
    if(v==='photo'&&!ui.draftCover&&!(ui.formId&&byId(ui.formId)&&byId(ui.formId).design==='photo')){ $('#coverInput').click(); return; }
    ui.draft.design=v; syncForm();
  },
  'cover-photo':()=>{ $('#coverInput').click(); },
  'backup':el=>openBackup(el),
  'backup-copy':()=>{
    const p=buildBackup();
    const done=()=>toast('Backup copied. Paste it somewhere safe.');
    const fallback=()=>p.then(t=>{ const x=$('#exportText'); if(!x) return; x.hidden=false; x.value=t; x.focus(); x.select(); toast('Copying was blocked. Select the text in the box and copy it.'); });
    try{
      if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
        navigator.clipboard.write([new ClipboardItem({'text/plain':p.then(t=>new Blob([t],{type:'text/plain'}))})]).then(done,()=>{ p.then(t=>navigator.clipboard.writeText(t)).then(done,fallback); });
        return;
      }
    }catch(e){}
    p.then(t=>navigator.clipboard.writeText(t)).then(done,fallback);
  },
  'backup-download':async()=>{
    if(!downloads) return;
    try{ await downloads.save({filename:'yera-library-'+today()+'.json',data:await buildBackup()}); toast('Backup saved.'); }
    catch(e){ const c=e&&e.code; if(c==='declined') return; if(c==='rate_limited'){ toast('A save is already waiting for an answer.'); return; } toast('Downloading isn’t available here. Use Copy backup instead.'); const b=$('#dlBtn'); if(b) b.hidden=true; }
  },
  'restore-check':()=>{
    const r=parseBackup(($('#restoreText').value||'').trim()), err=$('#restoreErr');
    if(!r){ err.textContent='That doesn’t look like a backup of this library. Paste all of it, starting with {.'; return; }
    ui.restore=r; err.textContent='';
    const nm=Object.keys(r.media).length, nb=r.state.books.length;
    $('#restoreActs').innerHTML='<span style="margin-right:auto;color:var(--ink-2);font-size:15px">This backup has '+nb+' book'+(nb===1?'':'s')+(nm?' and '+nm+' picture'+(nm===1?'':'s')+' or drawing'+(nm===1?'':'s'):'')+'. It replaces what’s here now.</span><button class="btn sm" type="button" data-action="restore-apply">Replace</button>';
    const a=$('[data-action="restore-apply"]'); if(a) a.focus();
  },
  'restore-apply':async()=>{
    const r=ui.restore; if(!r) return; ui.restore=null;
    await media.clear(); Array.from(urlCache.keys()).forEach(invalidate); Array.from(coverURLs.keys()).forEach(invalidateCover);
    let lost=0;
    for(const [id,v] of Object.entries(r.media)){
      let rec;
      if(id.indexOf('cover:')===0) rec={photo:v&&v.photo?fromDataURL(v.photo):null,t:Date.now()};
      else rec={ratio:clamp(+(v&&v.ratio)||.75,.2,5),strokes:v&&Array.isArray(v.strokes)?v.strokes:[],photo:v&&v.photo?fromDataURL(v.photo):null,ink:v&&v.ink?fromDataURL(v.ink):null,t:Date.now()};
      if(!(await media.set(id,rec))) lost++;
    }
    state=r.state; hero.pick=null; hero.sig=''; closeModal('miniModal'); commit(); saveNow();
    toast('Restored '+state.books.length+' book'+(state.books.length===1?'':'s')+'.');
    if(lost) warnMedia();
  }
};

/* on touch screens, a tapped book slides out of the shelf before it opens */
let lastPtr='mouse';
document.addEventListener('pointerdown',e=>{ lastPtr=e.pointerType||'mouse'; },{capture:true,passive:true});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-open],[data-action]'); if(!el) return;
  if(el.hasAttribute('data-open')){
    e.preventDefault();
    const id=el.dataset.open, opts={tab:el.dataset.tab||'notes',from:el,opener:el};
    if(el.classList.contains('slot')&&lastPtr!=='mouse'&&!HOVER.matches&&!RM.matches&&!ui.openId){
      if(el.classList.contains('pulling')) return;
      el.classList.add('pulling'); const b=byId(id); if(b) $('#caption').innerHTML=captionFor(b);
      setTimeout(()=>{ openBook(id,opts); setTimeout(()=>el.classList.remove('pulling'),650); },380);
      return;
    }
    openBook(id,opts); return;
  }
  const fn=ACTIONS[el.dataset.action]; if(fn){ e.preventDefault(); fn(el,e); }
});
document.addEventListener('keydown',e=>{
  const t=e.target; if(t&&t.id==='picBtn'&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); $('#picInput').click(); }
});
document.addEventListener('submit',e=>{
  const f=e.target; e.preventDefault();
  switch(f.dataset.form){
    case 'hero-log':{ const b=hero.info&&hero.info.book; if(!b||!byId(b.id)) return; setPage(b,$('#heroPage').value); commit(); toast('Page '+b.current+' saved.'); break; }
    case 'page':{ const b=byId(ui.openId); if(!b) return; setPage(b,$('#spPage').value); commit({spread:'left'}); break; }
    case 'note':{
      const b=byId(ui.openId); if(!b) return; const t=$('#noteText'), text=t.value.trim();
      if(!text){ t.focus(); t.setAttribute('placeholder','Write something first, then add it'); return; }
      const pg=$('#notePage'); ui.notePage=pg?pg.value:ui.notePage;
      b.notes.push({id:uid(),type:'text',page:parseInt(ui.notePage)||'',text,caption:'',ratio:1,at:new Date().toISOString(),sheet:ui.sheet}); b.touched=Date.now();
      ui.noteDraft='';
      commit({spread:'right'}); const t2=$('#noteText'); if(t2) t2.focus({preventScroll:true});
      const li=$('#pageR .note'); if(li&&!RM.matches) li.animate([{transform:'translateY(-10px)',opacity:0},{transform:'none',opacity:1}],{duration:460,easing:'cubic-bezier(.2,.8,.2,1)'});
      break;
    }
    case 'book': submitForm(); break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='noteText'){ ui.noteDraft=t.value; if(t.dataset.sp==='manuscript') t.classList.toggle('cjk',isMostlyCJK(t.value)); return; }
  if(t.id==='notePage'){ ui.notePage=t.value; return; }
  if(t.id==='fCustom'){ if(!ui.draft) return; readForm(); ui.draft.color=t.value; syncForm(); return; }
  if(t.dataset&&t.dataset.rfield){
    const b=byId(ui.openId); if(!b) return;
    b.report=b.report||{sentence:'',happens:'',moment:'',think:'',updated:''};
    b.report[t.dataset.rfield]=t.value; b.report.updated=today(); b.touched=Date.now();
    const rs=$('#repSaved'); if(rs) rs.textContent='Saving…';
    clearTimeout(repFlushT); repFlushT=setTimeout(()=>{
      repFlushT=0; saveNow(); renderReports();
      const rs2=$('#repSaved'); if(rs2) rs2.textContent=storageOK?'Saved':'Not saved in this browser';
      const rr=$('#repRead'); if(rr) rr.innerHTML=hasReport(b)?'<button class="link" type="button" data-action="read-report" data-id="'+b.id+'">Read it as a page</button>':'';
    },500);
  } else if(t.closest&&t.closest('#bookForm')){ readForm(); syncForm(); $('#fErr').textContent=''; }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='dpMonth'){ DP.m=+t.value; renderDatePop(); placeDatePop(); const s=$('#dpMonth'); if(s) s.focus(); return; }
  if(t.id==='dpYear'){ DP.y=+t.value; renderDatePop(); placeDatePop(); const s=$('#dpYear'); if(s) s.focus(); return; }
  if(t.dataset&&t.dataset.caption){ const b=byId(ui.openId); const n=b&&b.notes.find(x=>x.id===t.dataset.caption); if(!n) return; n.caption=t.value.trim(); save(); renderNotes(); }
  else if(t.id==='restoreFile'&&t.files&&t.files[0]){ const fr=new FileReader(); fr.onload=()=>{ $('#restoreText').value=String(fr.result||''); ACTIONS['restore-check'](); }; fr.readAsText(t.files[0]); }
});

/* ================= start ================= */
renderHero(); renderShelf(); renderNotes(); renderReports(); renderStorageNote();
armReveals();
initCloudSync();
window.addEventListener('focus', () => { initCloudSync(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') initCloudSync(); });
setInterval(initCloudSync, 60000);
/* tidy up drawings, pictures and cover photos nothing uses any more (older than a day, so other open tabs are safe) */
(async()=>{
  if(!loadedFromStorage) return;
  try{
    const used=new Set(); state.books.forEach(b=>{ if(b.design==='photo') used.add('cover:'+b.id); b.notes.forEach(n=>{ if(n.type!=='text') used.add(n.id); }); });
    for(const k of await media.keys()){ if(used.has(k)) continue; const v=await media.get(k); if(!v||Date.now()-(v.t||0)>864e5) await media.del(k); }
  }catch(e){}
})();
let lastSmall=SMALL.matches, rsT=0;
addEventListener('resize',()=>{ clearTimeout(rsT); rsT=setTimeout(()=>{
  if(SMALL.matches!==lastSmall){ lastSmall=SMALL.matches; renderShelf(); }
  if(!$('#drawModal').hidden&&!Dr.cur) layoutDraw();
  placeDatePop();
  const b=hero.info&&hero.info.book; if(b){ const d=heroDims(b); const cur=heroWrap.querySelector('.b3'); if(cur&&Math.abs(parseFloat(cur.style.getPropertyValue('--h'))-d.h)>12) buildHero(b); }
},180); });
})();
</script>
