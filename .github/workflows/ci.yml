name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Inline script syntax
        run: node .github/scripts/check-inline-script.js index.html ex-libris-yera.html

      - name: index.html and ex-libris-yera.html stay identical
        run: cmp index.html ex-libris-yera.html

      - name: functions/api/sync.js syntax
        run: node --check functions/api/sync.js
